<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="600" viewBox="0 0 1260 600" role="img" aria-labelledby="t d">
<title id="t">OPARLI architecture</title>
<desc id="d">Data sources (OHLCV bars, options chain, calendar and news, ETF history) feed a datafeed and store. The store feeds the research engine, the HAR volatility model and the scanner journal. Research findings go into a RAG research memory; the volatility model drives a vol-targeted portfolio; a multi-agent trading co-pilot reads memory, volatility, the journal and the store, and briefs the trader, whose decisions are logged back into the journal.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8A94A3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .ttl{font-size:14.5px;font-weight:600;fill:#111827}
    .sub{font-size:12px;fill:#4B5563}
    .col{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#9CA3AF}
    .tag{font-size:9.5px;font-weight:600;letter-spacing:.06em}
    .e{fill:none;stroke:#A3ACB9;stroke-width:1.4}
    .built{fill:#FFFFFF;stroke:#1F2937;stroke-width:1.3}
    .prog{fill:#FFFFFF;stroke:#2F6FB0;stroke-width:1.3}
    .plan{fill:#FFFFFF;stroke:#9CA3AF;stroke-width:1.3;stroke-dasharray:5 4}
    .chip{fill:#F1F5FA;stroke:#C9D6E6;stroke-width:1}
    .chipt{font-size:11px;fill:#2B4A6F}
  </style>
</defs>
<rect width="1260" height="600" fill="#FFFFFF"/>

<!-- Header -->
<rect x="40" y="30" width="14" height="14" rx="2" fill="#B8862B"/>
<text class="f" x="62" y="43" font-size="22" font-weight="700" fill="#111827">OPARLI</text>
<text class="f sub" x="40" y="68" font-size="13">A falsification-first research system for gold: live market data, a tested volatility model, and an AI co-pilot that briefs rather than trades.</text>

<!-- Legend -->
<g class="f">
  <rect x="890" y="28" width="22" height="13" rx="3" class="built"/><text x="918" y="39" class="sub">Built</text>
  <rect x="972" y="28" width="22" height="13" rx="3" class="prog"/><text x="1000" y="39" class="sub">In progress</text>
  <rect x="1088" y="28" width="22" height="13" rx="3" class="plan"/><text x="1116" y="39" class="sub">Planned</text>
</g>

<!-- Column headers -->
<g class="f col">
  <text x="40" y="108">DATA SOURCES</text>
  <text x="300" y="108">STORE</text>
  <text x="540" y="108">ENGINES</text>
  <text x="810" y="108">INTELLIGENCE</text>
  <text x="1070" y="108">DECISION</text>
</g>

<!-- Edges: sources -> store -->
<path class="e" d="M240 164 C270 164 272 240 298 240" marker-end="url(#a)"/>
<path class="e" d="M240 257 C270 257 272 278 298 278" marker-end="url(#a)"/>
<path class="e" d="M240 350 C270 350 272 322 298 322" marker-end="url(#a)"/>
<path class="e" d="M240 443 C270 443 272 360 298 360" marker-end="url(#a)"/>
<!-- store -> engines -->
<path class="e" d="M480 226 C510 226 510 180 538 180" marker-end="url(#a)"/>
<path class="e" d="M480 300 L538 300" marker-end="url(#a)"/>
<path class="e" d="M480 374 C510 374 510 410 538 410" marker-end="url(#a)"/>
<!-- store -> co-pilot (calendar, options, levels) -->
<path class="e" d="M480 212 C500 212 506 241 528 241 L786 241 C798 241 798 262 808 262" marker-end="url(#a)"/>
<!-- engines -> intelligence -->
<path class="e" d="M750 170 L808 170" marker-end="url(#a)"/>
<path class="e" d="M915 215 L915 233" marker-end="url(#a)"/>
<path class="e" d="M750 300 L808 300" marker-end="url(#a)"/>
<path class="e" d="M750 322 C782 322 780 465 808 465" marker-end="url(#a)"/>
<path class="e" d="M750 410 C780 410 782 370 808 370" marker-end="url(#a)"/>
<!-- intelligence -> decision -->
<path class="e" d="M1020 320 L1068 320" marker-end="url(#a)"/>
<path class="e" d="M1020 465 C1048 465 1046 352 1068 352" marker-end="url(#a)"/>
<!-- feedback: decisions -> journal -->
<path class="e" d="M1145 372 L1145 540 L645 540 L645 458" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text class="f sub" x="895" y="558" text-anchor="middle">every decision is logged back to the journal and scored</text>

<!-- Data sources -->
<g class="f">
  <rect x="40" y="125" width="200" height="78" rx="8" class="built"/>
  <text x="54" y="150" class="ttl">OHLCV bars</text>
  <text x="54" y="170" class="sub">XAUUSD 1-min, 2007 → live</text>
  <text x="54" y="188" class="sub">IBKR history + live stream</text>

  <rect x="40" y="218" width="200" height="78" rx="8" class="prog"/>
  <text x="54" y="243" class="ttl">Options chain</text>
  <text x="54" y="263" class="sub">COMEX gold options (OG)</text>
  <text x="54" y="281" class="sub">OI, IV, gamma · daily</text>

  <rect x="40" y="311" width="200" height="78" rx="8" class="prog"/>
  <text x="54" y="336" class="ttl">Calendar &amp; news</text>
  <text x="54" y="356" class="sub">CPI, NFP, FOMC, Fed text</text>
  <text x="54" y="374" class="sub">news + X / social feeds</text>

  <rect x="40" y="404" width="200" height="78" rx="8" class="plan"/>
  <text x="54" y="429" class="ttl">ETF history</text>
  <text x="54" y="449" class="sub">UCITS multi-asset, daily</text>
  <text x="54" y="467" class="sub">dividend-adjusted</text>
</g>

<!-- Store -->
<g class="f">
  <rect x="300" y="195" width="180" height="200" rx="8" class="built" fill="#FAFAF7"/>
  <text x="314" y="221" class="ttl">Datafeed &amp; store</text>
  <text x="314" y="252" class="sub m" font-size="11.5">IB Gateway → feed</text>
  <text x="314" y="276" class="sub m" font-size="11.5">Redis stream</text>
  <text x="314" y="300" class="sub m" font-size="11.5">recorder → SQLite</text>
  <text x="314" y="324" class="sub m" font-size="11.5">S3 backups</text>
  <text x="314" y="356" class="sub">manifest + seal guard</text>
  <text x="314" y="376" class="sub">no look-ahead by design</text>
</g>

<!-- Engines -->
<g class="f">
  <rect x="540" y="125" width="210" height="110" rx="8" class="built"/>
  <text x="554" y="150" class="ttl">Research engine</text>
  <text x="554" y="172" class="sub">PREREG → dev → holdout</text>
  <text x="554" y="190" class="sub">→ one forward test</text>
  <text x="554" y="216" class="sub">sealed data · attempt counter</text>

  <rect x="540" y="255" width="210" height="90" rx="8" class="built"/>
  <text x="554" y="280" class="ttl">Volatility model</text>
  <text x="554" y="302" class="sub">HAR σ from L, S_hd, T</text>
  <text x="554" y="322" class="sub">QLIKE −16 to −18%, 24/24 folds</text>

  <rect x="540" y="365" width="210" height="90" rx="8" class="built"/>
  <text x="554" y="390" class="ttl">Scanner &amp; journal</text>
  <text x="554" y="412" class="sub">level alerts on Telegram</text>
  <text x="554" y="432" class="sub">tracks every trade you take</text>
</g>

<!-- Intelligence -->
<g class="f">
  <rect x="810" y="125" width="210" height="90" rx="8" class="plan"/>
  <text x="824" y="150" class="ttl">Research memory</text>
  <text x="824" y="172" class="sub">RAG over every PREREG,</text>
  <text x="824" y="190" class="sub">report and null result</text>

  <rect x="810" y="235" width="210" height="170" rx="8" class="prog"/>
  <text x="824" y="260" class="ttl">Trading co-pilot</text>
  <text x="824" y="280" class="sub">multi-agent brief, per alert</text>
  <rect x="824" y="292" width="78" height="22" rx="11" class="chip"/><text x="863" y="307" class="chipt" text-anchor="middle">Technical</text>
  <rect x="908" y="292" width="58" height="22" rx="11" class="chip"/><text x="937" y="307" class="chipt" text-anchor="middle">Visual</text>
  <rect x="824" y="320" width="56" height="22" rx="11" class="chip"/><text x="852" y="335" class="chipt" text-anchor="middle">Macro</text>
  <rect x="886" y="320" width="44" height="22" rx="11" class="chip"/><text x="908" y="335" class="chipt" text-anchor="middle">GEX</text>
  <rect x="936" y="320" width="70" height="22" rx="11" class="chip"/><text x="971" y="335" class="chipt" text-anchor="middle">Memory</text>
  <text x="824" y="366" class="sub">blind round → discussion</text>
  <text x="824" y="386" class="sub">→ case for &amp; against</text>

  <rect x="810" y="425" width="210" height="80" rx="8" class="plan"/>
  <text x="824" y="450" class="ttl">Vol-targeted portfolio</text>
  <text x="824" y="471" class="sub">trend across ETFs</text>
  <text x="824" y="489" class="sub">sized by the σ model</text>
</g>

<!-- Status badges -->
<g class="f">
  <rect x="184" y="117" width="44" height="16" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1"/><text x="206.0" y="128.5" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".06em" fill="#1F2937">BUILT</text>
  <rect x="146" y="210" width="82" height="16" rx="8" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="1"/><text x="187.0" y="221.5" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".06em" fill="#2F6FB0">IN PROGRESS</text>
  <rect x="146" y="303" width="82" height="16" rx="8" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="1"/><text x="187.0" y="314.5" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".06em" fill="#2F6FB0">IN PROGRESS</text>
  <rect x="166" y="396" width="62" height="16" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/><text x="197.0" y="407.5" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".06em" fill="#6B7280">PLANNED</text>
  <rect x="424" y="187" width="44" height="16" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1"/><text x="446.0" y="198.5" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".06em" fill="#1F2937">BUILT</text>
  <rect x="694" y="117" width="44" height="16" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1"/><text x="716.0" y="128.5" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".06em" fill="#1F2937">BUILT</text>
  <rect x="694" y="247" width="44" height="16" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1"/><text x="716.0" y="258.5" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".06em" fill="#1F2937">BUILT</text>
  <rect x="694" y="357" width="44" height="16" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1"/><text x="716.0" y="368.5" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".06em" fill="#1F2937">BUILT</text>
  <rect x="946" y="117" width="62" height="16" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/><text x="977.0" y="128.5" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".06em" fill="#6B7280">PLANNED</text>
  <rect x="926" y="227" width="82" height="16" rx="8" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="1"/><text x="967.0" y="238.5" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".06em" fill="#2F6FB0">IN PROGRESS</text>
  <rect x="946" y="417" width="62" height="16" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/><text x="977.0" y="428.5" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing=".06em" fill="#6B7280">PLANNED</text>
</g>

<!-- Decision -->
<g class="f">
  <rect x="1070" y="282" width="150" height="90" rx="8" fill="#111827"/>
  <text x="1145" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">You decide</text>
  <text x="1145" y="340" text-anchor="middle" font-size="12" fill="#C7CED8">the agents brief,</text>
  <text x="1145" y="356" text-anchor="middle" font-size="12" fill="#C7CED8">they never trade</text>
</g>

</svg>
