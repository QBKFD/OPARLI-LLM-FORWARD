# Research-memory evaluation: 25 questions written from the documents
# (2026-11-15, before the first eval run; not changed after seeing results).
# `expected`: every corpus file that states the answer. A retrieval hit at k
# is any top-k chunk from one of them; a correct citation is an answered,
# check-passing response that cites one of them. Questions are paraphrased:
# they avoid the documents' own headings and wording where possible.
# Spread over the primary source's status: result 14, owner decision 2,
# post hoc 1, draft 3, reference 3, decision log 2.

