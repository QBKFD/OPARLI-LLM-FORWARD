# Packaging for the root-level `datafeed`, `agents`, `risk` and `scoring` packages only.
# Flat layout: the repo root also holds backend/, research/, tools/, legacy/,
# deploy/ and tests/, which are not part of this distribution, so package
# discovery is explicit.
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datafeed"
version = "0.1.0"
description = "XAUUSD 1-min bar feed: IBKR ingest, Redis stream bus, point-in-time SQLite store"
# The backend venv runs 3.13; the scanner image runs python:3.12-slim. Allow
# both so the scanner can later import this package inside its own image.
requires-python = ">=3.12"
dependencies = ["tzdata==2025.3"]  # zoneinfo data for _market_open (slim images ship none); bus, store, query are otherwise stdlib only

[project.optional-dependencies]
# Pinned to the versions the scanner image and backend venv already use.
feed = ["ib_insync==0.9.86", "redis==5.2.1"]
# Replay source reads the historical parquet.
replay = ["pandas==2.3.3", "numpy==2.2.6", "pyarrow==25.0.0"]
# datafeed.features (vol_block). Same pins as replay and research, so the lock
# is unchanged. risk/ itself is stdlib only.
features = ["numpy==2.2.6", "pandas==2.3.3"]
dev = ["pytest==9.1.1", "pytest-timeout==2.4.0"]
# The agents/ skeleton (LangGraph graph, pydantic schemas). Pinned to releases at
# least two weeks old on 2026-10-14. No LLM client: agents/ makes no LLM calls yet.
agents = ["langgraph==1.2.12", "pydantic==2.13.5"]
# Everything research/ imports (numpy, pandas, scipy, matplotlib, numba, pytest),
# plus pyarrow for pandas' parquet I/O. Pinned to the old backend venv
# (algo_project/backend/venv, Python 3.13.1), where the research baseline of
# 80 passed was run.
research = ["numpy==2.2.6", "pandas==2.3.3", "pyarrow==25.0.0", "scipy==1.17.1", "matplotlib==3.10.8",
            "numba==0.61.2", "pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["datafeed*", "agents*", "risk*", "scoring*"]

[tool.setuptools.package-data]
agents = ["prompts/*.md", "config.example.toml", "agents.example.toml", "experiments/README.md", "experiments/*/PREREG.md"]
# HAR sigma model files (vol_block.SIGMA_MODELS), SHA-256 checked on load.
datafeed = ["features/models/*.json"]

[tool.pytest.ini_options]
# A bare `pytest` at the root collects research/, tests/datafeed,
# tests/agents_tests, tests/risk_tests, tests/scoring_tests, tests/scanner and
# tests/deploy only. legacy/ is never collected: it is listed in norecursedirs
# (with pytest's own defaults), so it is skipped even when a parent directory is
# collected.
testpaths = ["research", "tests/datafeed", "tests/agents_tests", "tests/risk_tests",
             "tests/scoring_tests", "tests/scanner", "tests/deploy"]
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules",
                 "venv", "{arch}", "legacy"]
# pytest-timeout: fail any single test that runs longer than this (seconds).
# The slowest test (one replayed parquet day through the graph) takes ~10 s.
timeout = 120
markers = [
    "ibkr: needs a live IBKR gateway; manual only, skipped by default",
    "redis: needs a reachable Redis server; skipped when unavailable",
]

[tool.ruff]
# CI (.github/workflows/ci.yml) runs ruff twice: errors only (E9, F63, F7, F82)
# on the whole repo, and the default rules on the maintained packages (agents,
# risk, tools, datafeed, scoring). legacy/ is never linted.
extend-exclude = ["legacy"]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# `frames` is deleted (del frames) only after the last call of the closure that
# appends to it, so F821 is a static false positive there, not a runtime bug.
# The study's code is left as it was run.
"research/levels/run_levels.py" = ["F821"]

