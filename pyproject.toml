# Packaging for the one importable package, `backend` (backend.datafeed,
# backend.agents, backend.risk, backend.scoring and the scanner). The repo root
# also holds research/, tools/, legacy/, deploy/ and tests/, which are not part
# of this distribution, so package discovery is explicit.
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oparli"
version = "0.1.0"
description = "XAUUSD level scanner backend: bar feed (IBKR, Redis stream, point-in-time SQLite store), scoring, risk, agents"
# The backend venv runs 3.13; the scanner image runs python:3.12-slim. Allow
# both so the scanner can later import this package inside its own image.
requires-python = ">=3.12"
dependencies = ["tzdata==2025.3"]  # zoneinfo data for _market_open (slim images ship none); bus, store, query are otherwise stdlib only

[project.optional-dependencies]
# Pinned to the versions the scanner image and backend venv already use.
feed = ["ib_insync==0.9.86", "redis==5.2.1"]
# Replay source reads the historical parquet.
replay = ["pandas==2.3.3", "numpy==2.2.6", "pyarrow==25.0.0"]
# backend.datafeed.features (vol_block). Same pins as replay and research, so the lock
# is unchanged. risk/ itself is stdlib only.
features = ["numpy==2.2.6", "pandas==2.3.3"]
dev = ["pytest==9.1.1", "pytest-timeout==2.4.0"]
# The agents/ skeleton (LangGraph graph, pydantic schemas). Pinned to releases at
# least two weeks old on 2026-10-14. No LLM client: agents/ makes no LLM calls yet.
agents = ["langgraph==1.2.12", "pydantic==2.13.5"]
# The official Claude SDK for the LLM agents (agents/llm/anthropic_client.py,
# imported lazily: nothing else in agents/ loads it). Pinned to the newest
# release at least two weeks old on 2026-10-17 (1.11.0, 2026-09-30).
llm = ["anthropic==1.11.0"]
# Everything research/ imports (numpy, pandas, scipy, matplotlib, numba, pytest),
# plus pyarrow for pandas' parquet I/O. Pinned to the old backend venv
# (algo_project/backend/venv, Python 3.13.1), where the research baseline of
# 80 passed was run.
# tools/status: the Textual TUI (python -m tools.status). --once and the
# health.json writer are stdlib only and need no extra.
status = ["textual==8.2.8"]
research = ["numpy==2.2.6", "pandas==2.3.3", "pyarrow==25.0.0", "scipy==1.17.1", "matplotlib==3.10.8",
            "numba==0.61.2", "pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.agents" = ["prompts/*.md", "config.example.toml", "agents.example.toml", "experiments/README.md", "experiments/*/PREREG.md"]
# HAR sigma model files (vol_block.SIGMA_MODELS), SHA-256 checked on load, and the
# data manifest (store/manifest.py).
"backend.datafeed" = ["features/models/*.json", "store/manifest.json"]

[tool.pytest.ini_options]
# A bare `pytest` at the root collects research/, tests/datafeed, tests/agents,
# tests/risk, tests/scoring, tests/scanner, tests/deploy and tests/status only.
# tests/ and its directories are packages (__init__.py), so their modules are
# tests.<dir>.<module> and no test directory shadows backend.*. legacy/ is never
# collected: it is listed in norecursedirs (with pytest's own defaults), so it is
# skipped even when a parent directory is collected.
testpaths = ["research", "tests/datafeed", "tests/agents", "tests/risk",
             "tests/scoring", "tests/scanner", "tests/deploy", "tests/status", "tests/levels"]
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules",
                 "venv", "{arch}", "legacy"]
# pytest-timeout: fail any single test that runs longer than this (seconds).
# The slowest test (one replayed parquet day through the graph) takes ~10 s.
timeout = 120
markers = [
    "ibkr: needs a live IBKR gateway; manual only, skipped by default",
    "redis: needs a reachable Redis server; skipped when unavailable",
]

[tool.ruff]
# CI (.github/workflows/ci.yml) runs ruff twice: errors only (E9, F63, F7, F82)
# on the whole repo, and the default rules on the maintained packages
# (backend/agents, backend/risk, tools, backend/datafeed, backend/scoring).
# legacy/ is never linted.
extend-exclude = ["legacy"]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# `frames` is deleted (del frames) only after the last call of the closure that
# appends to it, so F821 is a static false positive there, not a runtime bug.
# The study's code is left as it was run.
"research/levels/run_levels.py" = ["F821"]


[tool.mypy]
# CI: mypy --strict on backend/levels; mypy on backend/scanner, where no
# finding may be added to tools/mypy_scanner_baseline.txt. pandas ships no
# type information, so it (and the scanner's other untyped dependencies) is Any.
python_version = "3.12"
ignore_missing_imports = true
