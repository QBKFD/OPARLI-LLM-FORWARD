# Always-on deterministic scanner on Oracle (or any Docker host).
#   ibgateway : IB Gateway + IBC (headless, auto-login, auto-daily-restart)
#   scanner   : deterministic_scanner.py --live, connects to ibgateway
#
# Deploy:  cp .env.example .env  &&  edit .env  &&  docker compose up -d --build
# The gnzsnz/ib-gateway image is multi-arch (works on Oracle Ampere / arm64).

services:
  ibgateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}     # paper: same market data, no order risk
      READ_ONLY_API: ${READ_ONLY_API:-yes}     # scanner only reads — keep this yes
      TWOFA_TIMEOUT_ACTION: restart
      # Daily restart inside gold's 17:00-18:00 ET break. Scheduled in New York
      # time because in UTC that break is 21-22 in summer but 22-23 in winter, so
      # no fixed UTC time is always inside it. IBC reads the time from TZ.
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-05:15 PM}
      # The daily auto-restart resumes a saved session; IBKR still wants a full
      # login weekly. IBC does that cold restart on Sundays at this time (New
      # York, market closed). If a daily resume fails anyway, watchdog.sh
      # forces a full re-login.
      TWS_COLD_RESTART: ${TWS_COLD_RESTART:-12:00}
      TIME_ZONE: ${TIME_ZONE:-America/New_York}
      TZ: ${TIME_ZONE:-America/New_York}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      # VNC bound to localhost only — SSH-tunnel in for the weekly 2FA login.
      - "127.0.0.1:5900:5900"
    networks: [scannernet]

  scanner:
    build:
      context: ../..                 # repo root, so the Dockerfile can COPY backend/
      dockerfile: deploy/scanner/Dockerfile
    restart: unless-stopped
    depends_on: [ibgateway]
    environment:
      IB_HOST: ibgateway
      # IB Gateway only accepts API clients from its own 127.0.0.1; the image's
      # socat relay publishes it to other containers on 4004 (paper) / 4003 (live).
      IB_PORT: ${IB_PORT:-4004}       # 4004 paper / 4003 live — match TRADING_MODE
      IB_CLIENT_ID: ${IB_CLIENT_ID:-11}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      SCANNER_DB: /data/scanner_decisions.sqlite
    volumes:
      - scanner_data:/data            # append-only decision journal persists here
    networks: [scannernet]

networks:
  scannernet:

volumes:
  scanner_data:
