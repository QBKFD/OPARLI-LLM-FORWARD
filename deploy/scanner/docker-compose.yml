# Always-on deterministic scanner (any Docker host; deployed on one EC2 instance).
#   ibgateway : IB Gateway + IBC (headless, auto-login, auto-daily-restart)
#   scanner   : deterministic_scanner.py --live
#
# Profile "stream" (COMPOSE_PROFILES=stream in .env, or --profile stream) adds
# the datafeed, started in this order through healthchecks:
#   redis -> feed (with SCANNER_BAR_SOURCE=stream, the ONLY gateway client)
#         -> recorder -> (the scanner waits for Redis and the store itself)
# SCANNER_BAR_SOURCE (default ibkr) picks where the scanner's bars come from.
# Flip / roll back / restore: docs/DEPLOY_RUNBOOK.md.
#
# Deploy:  cp .env.example .env  &&  edit .env  &&  docker compose up -d --build
# The gnzsnz/ib-gateway image is multi-arch (works on arm64 too).
#
# Memory limits fit a 3.8 GB host: 1536 + 512 + 256 + 192 + 384 = 2880 MB for the
# containers, ~0.9 GB left for the OS and Docker. Peaks measured 2026-10-15:
# scanner 194 MB (14-day warm-up + 2 live days with every rebuild), feed import
# 48 MB, recorder 14 MB. Keep a 2 GB swap file on the host (docs/DEPLOY_RUNBOOK.md).

# One image for scanner, feed and recorder (feed and recorder override the
# entrypoint). Same build and tag on each, so whichever builds first serves all.
x-app: &app
  build:
    context: ../..                 # repo root, so the Dockerfile can COPY backend/ and deploy/
    dockerfile: deploy/scanner/Dockerfile
  image: oparli-scanner:local
  networks: [scannernet]

services:
  ibgateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    mem_limit: 1536m                  # Java: by far the heaviest; check `docker stats` after deploy
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}     # paper: same market data, no order risk
      READ_ONLY_API: ${READ_ONLY_API:-yes}     # scanner only reads — keep this yes
      TWOFA_TIMEOUT_ACTION: restart
      # Daily restart inside gold's 17:00-18:00 ET break. Scheduled in New York
      # time because in UTC that break is 21-22 in summer but 22-23 in winter, so
      # no fixed UTC time is always inside it. IBC reads the time from TZ.
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-05:15 PM}
      # The daily auto-restart resumes a saved session; IBKR still wants a full
      # login weekly. IBC does that cold restart on Sundays at this time (New
      # York, market closed). If a daily resume fails anyway, watchdog.sh
      # forces a full re-login.
      TWS_COLD_RESTART: ${TWS_COLD_RESTART:-12:00}
      TIME_ZONE: ${TIME_ZONE:-America/New_York}
      TZ: ${TIME_ZONE:-America/New_York}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      # VNC bound to localhost only — SSH-tunnel in for the weekly 2FA login.
      - "127.0.0.1:5900:5900"
    networks: [scannernet]

  scanner:
    <<: *app
    restart: unless-stopped
    mem_limit: 512m                   # measured peak ~194 MB; backup/export run in here too
    # No dependency on the stream services, on purpose: a datafeed problem must
    # never keep the ibkr-mode scanner (the rollback) from starting. In stream
    # mode the entrypoint waits for Redis and the scanner waits for the store.
    depends_on: [ibgateway]
    environment:
      IB_HOST: ibgateway
      # IB Gateway only accepts API clients from its own 127.0.0.1; the image's
      # socat relay publishes it to other containers on 4004 (paper) / 4003 (live).
      IB_PORT: ${IB_PORT:-4004}       # 4004 paper / 4003 live — match TRADING_MODE
      IB_CLIENT_ID: ${IB_CLIENT_ID:-11}   # ibkr mode only (history load uses +10)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      SCANNER_DB: /data/scanner_decisions.sqlite
      SCANNER_BAR_SOURCE: ${SCANNER_BAR_SOURCE:-ibkr}
      SCANNER_HEARTBEAT: /data/heartbeat
      # stream mode only
      REDIS_URL: redis://redis:6379/0
      DATAFEED_DB: /datafeed/datafeed.sqlite
      SCANNER_STREAM_CONSUMER: ${SCANNER_STREAM_CONSUMER:-scanner-1}
    volumes:
      - scanner_data:/data            # append-only decision journal persists here
      # read-write mount on purpose: the scanner opens the store mode=ro, but a
      # WAL reader must be able to write the -shm file
      - datafeed_store:/datafeed
    healthcheck:
      # the main loop rewrites the heartbeat at least every ~70 s (Telegram long
      # poll); 300 s without one means it is hung
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/data/heartbeat') < 300 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s

  redis:
    image: redis:7.4.2-alpine
    profiles: [stream]
    restart: unless-stopped
    mem_limit: 384m                   # maxmemory 256mb + headroom for the AOF-rewrite fork
    # AOF fsync every second on a volume: pending entries and group positions
    # survive a restart. noeviction: when full, writes fail (the feed exits and
    # the scanner's staleness alert fires) rather than silently dropping
    # entries. Size comes from stream trimming (~34 MB for 100k entries).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [scannernet]            # no published port

  feed:
    <<: *app
    profiles: [stream]
    restart: unless-stopped           # crash-only: exits on any gateway problem
    mem_limit: 256m                   # import ~48 MB + the 10 D history burst
    entrypoint: ["python", "-m", "backend.datafeed.ingest"]
    depends_on:
      redis:
        condition: service_healthy
      ibgateway:
        condition: service_started
    environment:
      DATAFEED_SOURCE: ibkr
      REDIS_URL: redis://redis:6379/0
      IB_HOST: ibgateway
      IB_PORT: ${IB_PORT:-4004}
      IB_CLIENT_ID: ${FEED_IB_CLIENT_ID:-31}   # unused elsewhere: 11/21 scanner, 996 watchdog, 999 entrypoint
    healthcheck:
      # healthy once it has published: it starts with 10 D of IBKR history
      test: ["CMD", "python", "-c", "import os, sys, redis; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=5).xlen('bars.xauusd.1m') else 1)"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  recorder:
    <<: *app
    profiles: [stream]
    restart: unless-stopped
    mem_limit: 192m                   # import ~14 MB + SQLite
    entrypoint: ["python", "-m", "backend.datafeed.recorder"]
    depends_on:
      feed:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      DATAFEED_DB: /datafeed/datafeed.sqlite
      DATAFEED_RECORDER_CONSUMER: recorder-1    # stable across restarts
    volumes:
      - datafeed_store:/datafeed
    healthcheck:
      # healthy once the store has bars
      test: ["CMD", "python", "-c", "import sqlite3, sys; c = sqlite3.connect('file:/datafeed/datafeed.sqlite?mode=ro', uri=True); sys.exit(0 if c.execute('SELECT COUNT(*) FROM bars').fetchone()[0] else 1)"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s

networks:
  scannernet:

volumes:
  scanner_data:
  datafeed_store:
  redis_data:
